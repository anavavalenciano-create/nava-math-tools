<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mrs. Nava's Place Value Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root {
    --col-millions:    #e74c8b;
    --col-hthousands:  #f97316;
    --col-tthousands:  #eab308;
    --col-thousands:   #22c55e;
    --col-hundreds:    #06b6d4;
    --col-tens:        #6366f1;
    --col-ones:        #a855f7;
    --bg: #f0f4ff;
    --border: #dde3f0;
    --text: #1e1b4b;
    --muted: #6b7280;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(99,102,241,0.06) 0%, transparent 40%),
      radial-gradient(circle at 85% 70%, rgba(168,85,247,0.06) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(6,182,212,0.04) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }
  .app { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 16px 20px 40px; }

  /* HEADER */
  header {
    text-align: center; padding: 28px 24px 22px;
    background: linear-gradient(135deg, #6C63FF 0%, #8E7CFF 60%, #b06aff 100%);
    border-radius: var(--radius);
    box-shadow: 0 8px 32px rgba(108,99,255,0.25);
    margin-bottom: 4px;
    position: relative; overflow: hidden;
  }
  header::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 80% 50%, rgba(255,255,255,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .title-wrap { display: inline-flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
  .title-icon { font-size: 2.8rem; animation: bounce 2s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    color: white;
    -webkit-text-fill-color: white;
    line-height: 1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .subtitle { font-size: 1rem; color: rgba(255,255,255,0.85); font-weight: 600; margin-top: 6px; position: relative; z-index: 1; }

  /* TOOLBAR */
  .toolbar { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 14px 0 18px; }
  .btn {
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.9rem;
    padding: 10px 20px; border-radius: 50px; border: 3px solid transparent;
    cursor: pointer; transition: all 0.18s ease;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .btn:active { transform: translateY(0); }
  .btn-reset   { background: #fef2f2; color: #dc2626; border-color: #fca5a5; }
  .btn-toggle  { background: white; color: var(--muted); border-color: var(--border); }
  .btn-toggle.active { background: #1e1b4b; color: white; border-color: #1e1b4b; }
  .btn-prompt  { background: linear-gradient(135deg, #fbbf24, #f97316); color: white; }

  .main-area { display: flex; flex-direction: column; gap: 16px; }

  /* CHART */
  .pv-chart-wrapper {
    background: white; border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden; border: 2px solid var(--border);
  }
  .pv-chart { display: grid; grid-template-columns: repeat(7, 1fr); min-height: 300px; }
  .pv-column {
    display: flex; flex-direction: column;
    border-right: 2px solid var(--border); position: relative; min-width: 110px;
  }
  .pv-column:last-child { border-right: none; }

  .col-header {
    padding: 10px 6px 8px; text-align: center; font-weight: 800;
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: white; border-bottom: 2px solid rgba(0,0,0,0.1); line-height: 1.3;
  }
  .col-header-value { font-family: 'Fredoka One', cursive; font-size: 1.1rem; display: block; opacity: 0.9; letter-spacing: 0; }
  .col-header-name  { display: block; }

  .col-body {
    flex: 1; padding: 8px 6px; display: flex; flex-direction: column;
    align-items: center; gap: 4px; min-height: 180px; position: relative; transition: background 0.15s;
  }
  .col-body.drag-over { background: rgba(99,102,241,0.1); outline: 2px dashed #6366f1; outline-offset: -4px; }

  .disks-area {
    display: flex; flex-wrap: wrap; gap: 5px; justify-content: center;
    align-items: flex-start; min-height: 100px; width: 100%; padding: 4px; flex: 1;
  }
  .disk {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 0.7rem; color: white;
    cursor: grab; user-select: none;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2), inset 0 -2px 4px rgba(0,0,0,0.15);
    animation: popIn 0.2s cubic-bezier(0.34,1.56,0.64,1); flex-shrink: 0;
  }
  @keyframes popIn { from{transform:scale(0.3);opacity:0} to{transform:scale(1);opacity:1} }
  .disk:hover { transform: scale(1.15); box-shadow: 0 6px 16px rgba(0,0,0,0.25); }
  .disk:active { cursor: grabbing; }
  .disk.dragging { opacity: 0.35; transform: scale(0.9); }

  /* CONTROLS */
  .col-controls {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px 8px; gap: 4px; border-top: 1px solid var(--border); background: rgba(0,0,0,0.02);
  }
  .col-digit {
    font-family: 'Fredoka One', cursive; font-size: 2rem; line-height: 1;
    text-align: center; min-width: 40px; transition: color 0.2s;
  }
  .col-digit.changed { animation: digitPop 0.3s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes digitPop { 0%{transform:scale(1.5);opacity:0.5} 100%{transform:scale(1);opacity:1} }
  .add-btn, .remove-btn {
    width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer;
    font-size: 1.2rem; font-weight: 900; display: flex; align-items: center;
    justify-content: center; transition: transform 0.15s; color: white; flex-shrink: 0;
  }
  .add-btn:hover:not(:disabled),
  .remove-btn:hover:not(:disabled) { transform: scale(1.2); }
  .add-btn:disabled, .remove-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* BUNDLE */
  .bundle-zone { padding: 4px 8px 6px; text-align: center; }
  .bundle-btn {
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.72rem;
    padding: 5px 8px; border-radius: 20px; border: 2px dashed;
    cursor: pointer; background: transparent; transition: all 0.18s;
    width: 100%; display: none; line-height: 1.2;
  }
  .bundle-btn.visible { display: block; }
  .bundle-btn:hover { transform: scale(1.03); }
  .unbundle-btn { margin-top: 3px; }

  /* INFO STRIP */
  .chart-info-strip {
    display: grid; grid-template-columns: repeat(7, 1fr);
    background: #f8faff; border-top: 2px solid var(--border);
  }
  .strip-cell {
    padding: 7px 4px; text-align: center; border-right: 1px solid var(--border);
    font-size: 0.78rem; color: var(--muted); font-weight: 700;
  }
  .strip-cell:last-child { border-right: none; }
  .strip-value { font-family: 'Fredoka One', cursive; font-size: 1rem; display: block; transition: all 0.2s; }

  /* NUMBER DISPLAY */
  .number-display-card {
    background: white; border-radius: var(--radius);
    box-shadow: var(--shadow); border: 2px solid var(--border); padding: 16px 24px; text-align: center;
  }
  .number-display-card.compare-mode { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; }
  .number-section { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .number-label {
    font-size: 0.8rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); background: var(--bg); padding: 3px 12px; border-radius: 20px;
  }
  .number-label.a { background: #ede9fe; color: #6d28d9; }
  .number-label.b { background: #fef3c7; color: #b45309; }
  .standard-number {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 5vw, 3.5rem); color: var(--text); line-height: 1; letter-spacing: -1px;
  }
  .standard-number.changed { animation: numPop 0.35s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes numPop { 0%{transform:scale(1.1)} 100%{transform:scale(1)} }
  .expanded-form { font-size: 0.85rem; font-weight: 700; color: var(--muted); margin-top: 2px; word-break: break-word; }

  /* COMPARE */
  .compare-symbol { font-family: 'Fredoka One', cursive; font-size: 3rem; text-align: center; transition: all 0.3s; min-width: 60px; }
  .compare-symbol.gt { color: #22c55e; }
  .compare-symbol.lt { color: #ef4444; }
  .compare-symbol.eq { color: #6366f1; animation: equalPulse 1s ease-in-out infinite; }
  @keyframes equalPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
  .compare-place-hint { font-size: 0.75rem; font-weight: 700; color: var(--muted); margin-top: 4px; text-align: center; min-height: 1.2em; }
  .charts-container { display: flex; flex-direction: column; gap: 16px; }
  .chart-label {
    font-weight: 800; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 8px 16px; border-radius: 10px 10px 0 0; display: inline-block;
    margin-bottom: -2px; position: relative; z-index: 1;
  }
  .chart-label.a { background: #ede9fe; color: #6d28d9; border: 2px solid #c4b5fd; border-bottom: none; }
  .chart-label.b { background: #fef3c7; color: #b45309; border: 2px solid #fcd34d; border-bottom: none; }
  .pv-chart-wrapper.highlight-a { border-color: #c4b5fd; }
  .pv-chart-wrapper.highlight-b { border-color: #fcd34d; }
  .pv-column.compare-winner .col-body { background: rgba(34,197,94,0.08); }
  .pv-column.compare-diff   .col-body { background: rgba(239,68,68,0.06); }

  /* DID YOU KNOW */
  .dyk-card {
    background: white; border-radius: var(--radius); box-shadow: var(--shadow);
    border: 2px solid var(--border); padding: 16px 20px; cursor: pointer;
    position: relative; transition: transform 0.18s, box-shadow 0.18s;
    user-select: none; overflow: hidden;
  }
  .dyk-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .dyk-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--col-millions), var(--col-tthousands), var(--col-hundreds), var(--col-ones));
  }
  .dyk-inner { animation: fadeFact 0.4s ease; }
  @keyframes fadeFact { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .dyk-tap      { font-size: 0.72rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .dyk-headline { font-family: 'Fredoka One', cursive; font-size: 1.2rem; color: var(--text); margin: 3px 0 4px; display: flex; align-items: center; gap: 8px; }
  .dyk-emoji    { font-size: 1.6rem; }
  .dyk-body     { font-size: 0.88rem; font-weight: 600; color: #4b5563; line-height: 1.5; }

  /* PROMPT */
  .prompt-banner {
    background: linear-gradient(135deg, #fffbeb, #fef3c7); border: 2px solid #fcd34d;
    border-radius: var(--radius); padding: 14px 20px; text-align: center;
    position: relative; animation: slideDown 0.4s ease;
  }
  @keyframes slideDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
  .prompt-text  { font-family: 'Fredoka One', cursive; font-size: 1.3rem; color: #78350f; }
  .prompt-emoji { font-size: 1.5rem; }
  .prompt-close {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #92400e; opacity: 0.6;
  }
  .prompt-close:hover { opacity: 1; }

  /* ANIMATIONS */
  @keyframes bundleAnim  { 0%{transform:scale(1) rotate(0deg)} 30%{transform:scale(1.3) rotate(-5deg)} 60%{transform:scale(0.8) rotate(5deg)} 100%{transform:scale(1) rotate(0deg)} }
  .bundling   { animation: bundleAnim  0.4s ease; }
  @keyframes explodeAnim { 0%{transform:scale(1)} 20%{transform:scale(1.4)} 100%{transform:scale(1)} }
  .unbundling { animation: explodeAnim 0.35s ease; }

  /* FLASH */
  .tenx-flash {
    position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
    font-family: 'Fredoka One', cursive; font-size: 0.85rem; color: white;
    white-space: nowrap; background: #1e1b4b; border-radius: 20px; padding: 3px 10px;
    pointer-events: none; z-index: 200; animation: tenxAnim 1.9s ease forwards;
  }
  @keyframes tenxAnim {
    0%  { opacity:0; transform:translateX(-50%) translateY(0); }
    15% { opacity:1; }
    70% { opacity:1; transform:translateX(-50%) translateY(-28px); }
    100%{ opacity:0; transform:translateX(-50%) translateY(-36px); }
  }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .pv-chart-wrapper { overflow-x: auto; }
    .pv-chart, .chart-info-strip { min-width: 770px; }
  }
  @media (max-width: 600px) { .btn { font-size: 0.8rem; padding: 8px 14px; } }
  .hidden { display: none !important; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="title-wrap">
      <span class="title-icon">🔬</span>
      <div>
        <h1>Mrs. Nava's Place Value Lab</h1>
        <p class="subtitle">Build numbers · Explore place value · Compare &amp; discover</p>
      </div>
      <span class="title-icon">🔬</span>
    </div>
  </header>

  <div class="toolbar">
    <button class="btn btn-toggle" id="btnCompare"  onclick="toggleCompare()">⚖️ Compare Mode</button>
    <button class="btn btn-toggle" id="btnExpanded" onclick="toggleExpanded()">📋 Expanded Form</button>
    <button class="btn btn-prompt" onclick="showPrompt()">💡 Give me a Challenge!</button>
    <button class="btn btn-reset"  onclick="resetAll()">🔄 Reset</button>
  </div>

  <div class="prompt-banner hidden" id="promptBanner">
    <span class="prompt-emoji" id="promptEmoji">🌟</span>
    <span class="prompt-text"  id="promptText">Build a number greater than 50,000!</span>
    <button class="prompt-close" onclick="closePrompt()">✕</button>
  </div>

  <div class="main-area">

    <div class="number-display-card" id="numberDisplay">
      <div class="number-section">
        <span class="number-label">Your Number</span>
        <div class="standard-number" id="stdNumberA">0</div>
        <div class="expanded-form hidden" id="expFormA">0</div>
      </div>
    </div>

    <div class="charts-container" id="chartsContainer">

      <div id="chartAWrapper">
        <div class="chart-label a hidden" id="labelA">🟣 Number A</div>
        <div class="pv-chart-wrapper" id="chartA_wrapper">
          <div class="pv-chart"         id="chartA"></div>
          <div class="chart-info-strip" id="stripA"></div>
        </div>
      </div>

      <div id="chartBWrapper" class="hidden">
        <div class="chart-label b" id="labelB">🟡 Number B</div>
        <div class="pv-chart-wrapper highlight-b" id="chartB_wrapper">
          <div class="pv-chart"         id="chartB"></div>
          <div class="chart-info-strip" id="stripB"></div>
        </div>
      </div>

    </div>

    <div class="dyk-card" id="dykCard" onclick="nextFact()">
      <div class="dyk-inner" id="dykInner">
        <div class="dyk-tap">💡 Did You Know? · Tap for a new fact!</div>
        <div class="dyk-headline">
          <span class="dyk-emoji" id="dykEmoji">🏟️</span>
          <span id="dykHeadline">Loading…</span>
        </div>
        <p class="dyk-body" id="dykBody"></p>
      </div>
    </div>

  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────────────────────
const PLACES = [
  { id:'millions',   name:'Millions',        short:'M',   value:1000000, color:'#e74c8b' },
  { id:'hthousands', name:'Hundred\nThous.', short:'HTh', value:100000,  color:'#f97316' },
  { id:'tthousands', name:'Ten\nThousands',  short:'TTh', value:10000,   color:'#eab308' },
  { id:'thousands',  name:'Thousands',       short:'Th',  value:1000,    color:'#22c55e' },
  { id:'hundreds',   name:'Hundreds',        short:'H',   value:100,     color:'#06b6d4' },
  { id:'tens',       name:'Tens',            short:'T',   value:10,      color:'#6366f1' },
  { id:'ones',       name:'Ones',            short:'O',   value:1,       color:'#a855f7' },
];

const CAP_ADD    = 9;   // + button is disabled at 9 (visual cap for normal adding)
const CAP_BUNDLE = 10;  // state can reach 10 via bundling/unbundling/drag; bundle triggers at 10

// ─────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────
let stateA      = {};
let stateB      = {};
let compareMode  = false;
let showExpanded = false;
let dragInfo     = null;

PLACES.forEach(p => { stateA[p.id] = 0; stateB[p.id] = 0; });

// ─────────────────────────────────────────────────────────────
// DID YOU KNOW
// ─────────────────────────────────────────────────────────────
const FACTS = [
  { emoji:'🏟️', headline:'Stadiums & Big Numbers',  body:'A big NFL stadium holds about 100,000 fans! That\'s a 1 in the hundred-thousands place.' },
  { emoji:'🍕', headline:'Pizza Slices Galore!',     body:'Americans eat about 3,000,000 pizza slices every single day — a 3 in the millions place!' },
  { emoji:'🦷', headline:'Teeth Count',              body:'You have 20 baby teeth. That\'s 2 tens and 0 ones — super simple place value!' },
  { emoji:'📚', headline:'Library Books',            body:'A big city library might hold 1,000,000 books — one million is a 1 followed by 6 zeros.' },
  { emoji:'🐝', headline:'Beehive Buzz',             body:'A single beehive can have up to 80,000 bees. That\'s 8 in the ten-thousands place!' },
  { emoji:'🏃', headline:'Steps in a Marathon',      body:'Running a marathon takes about 40,000 steps — a 4 in the ten-thousands place!' },
  { emoji:'🎬', headline:'Movie Frames',             body:'A 2-hour movie has about 172,800 frames. Each digit in that number tells a different story!' },
  { emoji:'🌊', headline:'Ocean Depth',              body:'The deepest ocean point is about 36,000 feet — 3 ten-thousands and 6 thousands!' },
  { emoji:'⭐', headline:'Stars You Can See',        body:'On a clear night you can spot about 5,000 stars. Just a 5 in the thousands place!' },
  { emoji:'🎵', headline:'Music Beats',              body:'A pop song at 120 BPM has 7,200 beats per hour — look for the thousands place!' },
  { emoji:'🏀', headline:'NBA Points Record',        body:'The all-time NBA scoring record is near 40,000 points — a 4 in the ten-thousands!' },
  { emoji:'🌱', headline:'Seeds in a Sunflower',     body:'One giant sunflower holds up to 2,000 seeds — a 2 in the thousands place!' },
  { emoji:'🚀', headline:'Space Station Speed',      body:'The ISS travels about 17,500 mph. Spot the ten-thousands, thousands, and hundreds!' },
  { emoji:'🦈', headline:'Shark Teeth Lifetime',     body:'A shark grows up to 50,000 teeth in its lifetime — 5 in the ten-thousands!' },
  { emoji:'📱', headline:'App Downloads',            body:'Popular apps get 1,000,000 downloads in a single day. That 1 is in the millions place!' },
  { emoji:'🐘', headline:'Elephant Weight',          body:'An elephant weighs about 14,000 pounds — 1 ten-thousand and 4 thousands!' },
  { emoji:'💧', headline:'Drops in a Liter',         body:'A liter of water has about 20,000 drops — a 2 in the ten-thousands place!' },
  { emoji:'🌍', headline:'Miles Around Earth',       body:'Earth\'s circumference is about 25,000 miles — 2 in ten-thousands and 5 in thousands!' },
  { emoji:'🎢', headline:'Theme Park Visitors',      body:'A busy theme park has about 50,000 visitors a day — a 5 in the ten-thousands!' },
  { emoji:'🎃', headline:'Pumpkin Harvest',          body:'The US grows about 700,000,000 pounds of pumpkins a year. That 7 is way up in the hundred-millions!' },
];
let lastFactIdx = -1;

function nextFact() {
  let next;
  do { next = Math.floor(Math.random() * FACTS.length); } while (next === lastFactIdx);
  lastFactIdx = next;
  const f = FACTS[next];
  const inner = document.getElementById('dykInner');
  inner.style.animation = 'none';
  void inner.offsetWidth;
  inner.style.animation = '';
  document.getElementById('dykEmoji').textContent    = f.emoji;
  document.getElementById('dykHeadline').textContent = f.headline;
  document.getElementById('dykBody').textContent     = f.body;
}

// ─────────────────────────────────────────────────────────────
// BUILD CHART
// ─────────────────────────────────────────────────────────────
function buildChart(chartId, stripId, state) {
  const chart = document.getElementById(chartId);
  const strip = document.getElementById(stripId);
  chart.innerHTML = '';
  strip.innerHTML = '';

  PLACES.forEach((p, i) => {
    const col = document.createElement('div');
    col.className     = 'pv-column';
    col.id            = `${chartId}_col_${p.id}`;
    col.dataset.place = p.id;
    col.dataset.chart = chartId;

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'col-header';
    hdr.style.background = p.color;
    hdr.innerHTML = `<span class="col-header-name">${p.name.replace('\n','<br>')}</span>`
                  + `<span class="col-header-value">&times;${formatNum(p.value)}</span>`;
    col.appendChild(hdr);

    // Body / drop zone
    const body = document.createElement('div');
    body.className = 'col-body';
    body.id = `${chartId}_body_${p.id}`;
    const disksArea = document.createElement('div');
    disksArea.className = 'disks-area';
    disksArea.id = `${chartId}_disks_${p.id}`;
    body.appendChild(disksArea);
    body.addEventListener('dragover',  e => { e.preventDefault(); body.classList.add('drag-over'); });
    body.addEventListener('dragleave', ()  => body.classList.remove('drag-over'));
    body.addEventListener('drop', e => { e.preventDefault(); body.classList.remove('drag-over'); handleDrop(chartId, p.id); });
    col.appendChild(body);

    // Bundle zone
    const bz = document.createElement('div');
    bz.className = 'bundle-zone';
    if (i > 0) {
      const bb = document.createElement('button');
      bb.className = 'bundle-btn'; bb.id = `${chartId}_bundle_${p.id}`;
      bb.style.color = PLACES[i-1].color; bb.style.borderColor = PLACES[i-1].color;
      bb.textContent = `Bundle 10 \u2192 1 ${PLACES[i-1].name.replace('\n',' ')}`;
      bb.onclick = () => bundleDisks(chartId, p.id);
      bz.appendChild(bb);
    }
    if (i < PLACES.length - 1) {
      const ub = document.createElement('button');
      ub.className = 'bundle-btn unbundle-btn'; ub.id = `${chartId}_unbundle_${p.id}`;
      ub.style.color = p.color; ub.style.borderColor = p.color;
      ub.textContent = `Break 1 \u2192 10 ${PLACES[i+1].name.replace('\n',' ')}`;
      ub.onclick = () => unbundleDisks(chartId, p.id);
      bz.appendChild(ub);
    }
    col.appendChild(bz);

    // +/digit/- controls
    const controls = document.createElement('div');
    controls.className = 'col-controls';
    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn'; removeBtn.style.background = p.color;
    removeBtn.id = `${chartId}_remove_${p.id}`; removeBtn.innerHTML = '&minus;';
    removeBtn.title = `Remove one ${p.name.replace('\n',' ')}`;
    removeBtn.onclick = () => changeValue(chartId, p.id, -1);
    const digit = document.createElement('div');
    digit.className = 'col-digit'; digit.id = `${chartId}_digit_${p.id}`;
    digit.textContent = '0'; digit.style.color = p.color;
    const addBtn = document.createElement('button');
    addBtn.className = 'add-btn'; addBtn.style.background = p.color;
    addBtn.id = `${chartId}_add_${p.id}`; addBtn.innerHTML = '+';
    addBtn.title = `Add one ${p.name.replace('\n',' ')}`;
    addBtn.onclick = () => changeValue(chartId, p.id, 1);
    controls.appendChild(removeBtn); controls.appendChild(digit); controls.appendChild(addBtn);
    col.appendChild(controls);
    chart.appendChild(col);

    // Strip cell
    const cell = document.createElement('div');
    cell.className = 'strip-cell'; cell.id = `${chartId}_strip_${p.id}`;
    cell.innerHTML = `<span class="strip-value" style="color:${p.color}" id="${chartId}_stripval_${p.id}">—</span>`
                   + `<span style="font-size:0.65rem;color:#9ca3af">${p.short} value</span>`;
    strip.appendChild(cell);
  });

  renderChart(chartId, state);
}

// ─────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────
function renderChart(chartId, state) {
  PLACES.forEach((p, i) => {
    const count     = state[p.id] || 0;
    const disksArea = document.getElementById(`${chartId}_disks_${p.id}`);
    const digitEl   = document.getElementById(`${chartId}_digit_${p.id}`);
    const addBtn    = document.getElementById(`${chartId}_add_${p.id}`);
    const removeBtn = document.getElementById(`${chartId}_remove_${p.id}`);
    const stripVal  = document.getElementById(`${chartId}_stripval_${p.id}`);
    if (!disksArea) return;

    // Sync disks
    const existing = disksArea.querySelectorAll('.disk');
    const diff = count - existing.length;
    if (diff > 0) {
      for (let d = 0; d < diff; d++) disksArea.appendChild(makeDisk(p, chartId));
    } else if (diff < 0) {
      const all = disksArea.querySelectorAll('.disk');
      for (let d = all.length - 1; d >= all.length + diff; d--) all[d].remove();
    }

    // Digit
    if (digitEl.textContent !== String(count)) {
      digitEl.textContent = count;
      digitEl.classList.remove('changed'); void digitEl.offsetWidth; digitEl.classList.add('changed');
    }

    // Disable + at 10 (CAP_BUNDLE); once at 10 the Bundle button appears instead
    addBtn.disabled    = count >= CAP_BUNDLE;
    removeBtn.disabled = count <= 0;

    // Bundle buttons  (FIX: correct caps)
    const bundleBtn   = document.getElementById(`${chartId}_bundle_${p.id}`);
    const unbundleBtn = document.getElementById(`${chartId}_unbundle_${p.id}`);
    if (bundleBtn) {
      const aboveCount = i > 0 ? (state[PLACES[i-1].id] || 0) : 99;
      // Show bundle button when this column has 10 AND above column has room
      bundleBtn.classList.toggle('visible', count >= 10 && aboveCount < CAP_BUNDLE);
    }
    if (unbundleBtn) {
      const belowCount = i < PLACES.length-1 ? (state[PLACES[i+1].id] || 0) : 99;
      // unbundle: need ≥1 here AND below + 10 fits within CAP_BUNDLE (10)
      unbundleBtn.classList.toggle('visible', count >= 1 && belowCount + 10 <= CAP_BUNDLE);
    }

    // Strip
    const val = count * p.value;
    stripVal.textContent = val > 0 ? formatNum(val) : '—';
  });

  updateNumberDisplay();
  if (compareMode) updateCompare();
}

function makeDisk(place, chartId) {
  const disk = document.createElement('div');
  disk.className = 'disk';
  disk.style.background = `radial-gradient(circle at 35% 35%, ${lighten(place.color)}, ${place.color})`;
  disk.style.boxShadow  = `0 3px 8px ${place.color}55, inset 0 -2px 4px rgba(0,0,0,0.2)`;
  disk.textContent = place.short;
  disk.title       = `Drag me to an adjacent column!`;
  disk.draggable   = true;
  disk.addEventListener('dragstart', () => {
    dragInfo = { chartId, placeId: place.id };
    setTimeout(() => disk.classList.add('dragging'), 0);
  });
  disk.addEventListener('dragend', () => {
    disk.classList.remove('dragging');
    dragInfo = null; // FIX: always clear on dragend
  });
  return disk;
}

function lighten(hex) {
  return `rgb(${Math.min(255,parseInt(hex.slice(1,3),16)+60)},${Math.min(255,parseInt(hex.slice(3,5),16)+60)},${Math.min(255,parseInt(hex.slice(5,7),16)+60)})`;
}

// ─────────────────────────────────────────────────────────────
// INTERACTIONS
// ─────────────────────────────────────────────────────────────
function getState(chartId) { return chartId === 'chartA' ? stateA : stateB; }

function changeValue(chartId, placeId, delta) {
  const state = getState(chartId);
  // Clamp at CAP_BUNDLE so the +button can push a column to 10, enabling bundling
  state[placeId] = Math.max(0, Math.min(CAP_BUNDLE, (state[placeId] || 0) + delta));
  renderChart(chartId, state);
}

// FIX: only allow adjacent (±1 step) drags with correct 10x math; block non-adjacent silently
function handleDrop(chartId, targetPlaceId) {
  if (!dragInfo) return;
  const savedDrag = { ...dragInfo };
  dragInfo = null; // consume immediately

  if (savedDrag.chartId !== chartId) return;
  if (savedDrag.placeId === targetPlaceId) return;

  const state   = getState(chartId);
  const fromIdx = PLACES.findIndex(p => p.id === savedDrag.placeId);
  const toIdx   = PLACES.findIndex(p => p.id === targetPlaceId);
  const step    = toIdx - fromIdx; // +1 = right (bigger→smaller), -1 = left (smaller→bigger)

  if (Math.abs(step) !== 1) {
    // Non-adjacent: guide student, no value change
    showTenxFlash(chartId, targetPlaceId, 'Move one column at a time! ➡️');
    return;
  }

  const srcId = PLACES[fromIdx].id;
  const tgtId = PLACES[toIdx].id;

  if (step === 1) {
    // Moving RIGHT: 1 bigger → 10 smaller
    if ((state[srcId] || 0) < 1) return;
    if ((state[tgtId] || 0) + 10 > CAP_BUNDLE) {
      showTenxFlash(chartId, tgtId, 'That column is too full!'); return;
    }
    state[srcId]--;
    state[tgtId] = (state[tgtId] || 0) + 10;
    showTenxFlash(chartId, tgtId, `1 ${PLACES[fromIdx].short} = 10 ${PLACES[toIdx].short}s!`);
  } else {
    // Moving LEFT: 10 smaller → 1 bigger
    if ((state[srcId] || 0) < 10) {
      showTenxFlash(chartId, srcId, `Need 10 ${PLACES[fromIdx].short}s to do that!`); return;
    }
    if ((state[tgtId] || 0) >= CAP_BUNDLE) {
      showTenxFlash(chartId, tgtId, 'That column is full!'); return;
    }
    state[srcId] -= 10;
    state[tgtId] = (state[tgtId] || 0) + 1;
    showTenxFlash(chartId, tgtId, `10 ${PLACES[fromIdx].short}s = 1 ${PLACES[toIdx].short}! \uD83C\uDF89`);
  }

  renderChart(chartId, state);
}

function bundleDisks(chartId, placeId) {
  const state = getState(chartId);
  const idx   = PLACES.findIndex(p => p.id === placeId);
  if (idx <= 0) return;
  if ((state[placeId] || 0) < 10) return;
  const above = PLACES[idx - 1];
  if ((state[above.id] || 0) >= CAP_BUNDLE) {
    showTenxFlash(chartId, above.id, 'Column is full!'); return;
  }
  state[placeId] -= 10;
  state[above.id] = (state[above.id] || 0) + 1;
  setTimeout(() => {
    const disks = document.querySelectorAll(`#${chartId}_disks_${above.id} .disk`);
    if (disks.length) { const last = disks[disks.length-1]; last.classList.remove('bundling'); void last.offsetWidth; last.classList.add('bundling'); }
  }, 50);
  showTenxFlash(chartId, above.id, `10 ${PLACES[idx].short}s = 1 ${above.short}! \uD83C\uDF89`);
  renderChart(chartId, state);
}

function unbundleDisks(chartId, placeId) {
  const state = getState(chartId);
  const idx   = PLACES.findIndex(p => p.id === placeId);
  if (idx >= PLACES.length - 1) return;
  if ((state[placeId] || 0) < 1) return;
  const below = PLACES[idx + 1];
  if ((state[below.id] || 0) + 10 > CAP_BUNDLE) {
    showTenxFlash(chartId, below.id, 'Not enough room to break apart here!'); return;
  }
  state[placeId]--;
  state[below.id] = (state[below.id] || 0) + 10;
  setTimeout(() => {
    const disks = document.querySelectorAll(`#${chartId}_disks_${below.id} .disk`);
    disks.forEach(d => { d.classList.remove('unbundling'); void d.offsetWidth; d.classList.add('unbundling'); });
  }, 50);
  showTenxFlash(chartId, below.id, `1 ${PLACES[idx].short} \u2192 10 ${below.short}s! \u2728`);
  renderChart(chartId, state);
}

function showTenxFlash(chartId, placeId, msg) {
  const body = document.getElementById(`${chartId}_body_${placeId}`);
  if (!body) return;
  body.querySelectorAll('.tenx-flash').forEach(f => f.remove());
  const flash = document.createElement('div');
  flash.className   = 'tenx-flash';
  flash.textContent = msg;
  body.appendChild(flash);
  setTimeout(() => flash.remove(), 2000);
}

// ─────────────────────────────────────────────────────────────
// NUMBER DISPLAY  (FIX: always query DOM fresh to survive innerHTML rebuilds)
// ─────────────────────────────────────────────────────────────
function formatNum(n) { return n.toLocaleString('en-US'); }
function calcNumber(state) { return PLACES.reduce((s, p) => s + (state[p.id]||0)*p.value, 0); }
function getExpandedForm(state) {
  const parts = PLACES.filter(p=>(state[p.id]||0)>0).map(p=>formatNum((state[p.id]||0)*p.value));
  return parts.length ? parts.join(' + ') : '0';
}

function animateNum(el, txt) {
  if (!el || el.textContent === txt) return;
  el.textContent = txt;
  el.classList.remove('changed'); void el.offsetWidth; el.classList.add('changed');
}

function updateNumberDisplay() {
  animateNum(document.getElementById('stdNumberA'), formatNum(calcNumber(stateA)));
  const efA = document.getElementById('expFormA');
  if (efA) efA.textContent = getExpandedForm(stateA);
  if (compareMode) {
    animateNum(document.getElementById('stdNumberB'), formatNum(calcNumber(stateB)));
    const efB = document.getElementById('expFormB');
    if (efB) efB.textContent = getExpandedForm(stateB);
  }
}

// ─────────────────────────────────────────────────────────────
// COMPARE MODE
// ─────────────────────────────────────────────────────────────
function updateCompare() {
  const symEl  = document.getElementById('compareSymbol');
  const hintEl = document.getElementById('compareHint');
  if (!symEl || !hintEl) return;
  const numA = calcNumber(stateA), numB = calcNumber(stateB);
  PLACES.forEach(p => { ['chartA','chartB'].forEach(c => { const col = document.getElementById(`${c}_col_${p.id}`); if(col) col.classList.remove('compare-winner','compare-diff'); }); });
  if      (numA > numB) { symEl.textContent = '>'; symEl.className = 'compare-symbol gt'; }
  else if (numA < numB) { symEl.textContent = '<'; symEl.className = 'compare-symbol lt'; }
  else                  { symEl.textContent = '='; symEl.className = 'compare-symbol eq'; }
  let diffPlace = null;
  for (const p of PLACES) { if ((stateA[p.id]||0) !== (stateB[p.id]||0)) { diffPlace = p; break; } }
  if (diffPlace) {
    hintEl.textContent = `Difference in the ${diffPlace.name.replace('\n',' ')} place!`;
    const winA = (stateA[diffPlace.id]||0) > (stateB[diffPlace.id]||0);
    const cA = document.getElementById(`chartA_col_${diffPlace.id}`);
    const cB = document.getElementById(`chartB_col_${diffPlace.id}`);
    if (cA) cA.classList.add(winA  ? 'compare-winner' : 'compare-diff');
    if (cB) cB.classList.add(!winA ? 'compare-winner' : 'compare-diff');
  } else {
    hintEl.textContent = numA === 0 ? '' : 'Both numbers are equal! 🎉';
  }
}

function toggleCompare() {
  compareMode = !compareMode;
  document.getElementById('btnCompare').classList.toggle('active', compareMode);
  const chartBWrap = document.getElementById('chartBWrapper');
  const labelA     = document.getElementById('labelA');
  const numDisplay = document.getElementById('numberDisplay');

  if (compareMode) {
    chartBWrap.classList.remove('hidden');
    labelA.classList.remove('hidden');
    numDisplay.className = 'number-display-card compare-mode';
    numDisplay.innerHTML = `
      <div class="number-section">
        <span class="number-label a">🟣 Number A</span>
        <div class="standard-number" id="stdNumberA">${formatNum(calcNumber(stateA))}</div>
        <div class="expanded-form ${showExpanded?'':'hidden'}" id="expFormA">${getExpandedForm(stateA)}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="compare-symbol" id="compareSymbol">?</div>
        <div class="compare-place-hint" id="compareHint">Build two numbers to compare!</div>
      </div>
      <div class="number-section">
        <span class="number-label b">🟡 Number B</span>
        <div class="standard-number" id="stdNumberB">${formatNum(calcNumber(stateB))}</div>
        <div class="expanded-form ${showExpanded?'':'hidden'}" id="expFormB">${getExpandedForm(stateB)}</div>
      </div>`;
    if (!document.getElementById('chartB').children.length) buildChart('chartB','stripB',stateB);
    updateCompare();
  } else {
    chartBWrap.classList.add('hidden');
    labelA.classList.add('hidden');
    numDisplay.className = 'number-display-card';
    numDisplay.innerHTML = `
      <div class="number-section">
        <span class="number-label">Your Number</span>
        <div class="standard-number" id="stdNumberA">${formatNum(calcNumber(stateA))}</div>
        <div class="expanded-form ${showExpanded?'':'hidden'}" id="expFormA">${getExpandedForm(stateA)}</div>
      </div>`;
  }
}

// FIX: query fresh DOM after any innerHTML rebuild
function toggleExpanded() {
  showExpanded = !showExpanded;
  document.getElementById('btnExpanded').classList.toggle('active', showExpanded);
  document.querySelectorAll('.expanded-form').forEach(el => el.classList.toggle('hidden', !showExpanded));
}

// ─────────────────────────────────────────────────────────────
// PROMPTS
// ─────────────────────────────────────────────────────────────
const PROMPTS = [
  { emoji:'🚀', text:'Build a number greater than 50,000!' },
  { emoji:'⚖️', text:'Can you make two numbers that are equal?' },
  { emoji:'🏆', text:'Build the biggest number you can!' },
  { emoji:'🔍', text:'Make a number with a 7 in the thousands place.' },
  { emoji:'🎯', text:'Build a number between 100,000 and 200,000.' },
  { emoji:'🌟', text:'Bundle 10 ones into 1 ten — watch it change!' },
  { emoji:'🤯', text:'Try making 999,999 — how close can you get?' },
  { emoji:'🔄', text:'Break apart (unbundle) one of your hundreds.' },
  { emoji:'🎪', text:'Make two numbers where the thousands digits are different.' },
  { emoji:'💡', text:'Build a number where all 7 place values are used!' },
  { emoji:'🧩', text:'Make a number with exactly 3 digits.' },
  { emoji:'🌈', text:'Can you make 1,000,000? What does it look like?' },
];
let promptIdx = 0;
function showPrompt() {
  const p = PROMPTS[promptIdx++ % PROMPTS.length];
  document.getElementById('promptEmoji').textContent = p.emoji;
  document.getElementById('promptText').textContent  = p.text;
  document.getElementById('promptBanner').classList.remove('hidden');
}
function closePrompt() { document.getElementById('promptBanner').classList.add('hidden'); }

// ─────────────────────────────────────────────────────────────
// RESET
// ─────────────────────────────────────────────────────────────
function resetAll() {
  PLACES.forEach(p => { stateA[p.id] = 0; stateB[p.id] = 0; });
  renderChart('chartA', stateA);
  if (compareMode) { renderChart('chartB', stateB); updateCompare(); }
  closePrompt();
}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────
buildChart('chartA', 'stripA', stateA);
nextFact();
</script>
